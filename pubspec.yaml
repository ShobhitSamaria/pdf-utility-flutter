name: pdf_utility_flutter
description: "On-device OCR, translation and PDF toolkit for Android."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # --- OCR foundation ------------------------------------------------
  # Camera preview + still capture (native CameraX on Android).
  camera: ^0.12.1

  # Pick an existing image from the gallery (Android Photo Picker under the
  # hood - no storage permission required on modern Android).
  image_picker: ^1.2.3

  # On-device Google ML Kit Text Recognition. Runs natively (no cloud, no
  # Tesseract, no Python backend) and exposes block/line/element geometry.
  google_mlkit_text_recognition: ^0.17.1

  # Shared ML Kit types (InputImage) used to hand a file path to the native
  # recognizer. Pulled in transitively but declared explicitly since we use it.
  google_mlkit_commons: ^0.13.0

  # Opens the device browser for the "Search" selection action. First-party
  # Flutter plugin.
  url_launcher: ^6.3.3

  # --- Translation foundation --------------------------------------------
  # On-device Google ML Kit Translation ("OCR text -> Hindi"). Runs natively
  # using language models provisioned on the device: no cloud API, no Chrome/
  # web translation, no Python backend. This is the ONLY package the
  # lib/translation/data layer is allowed to import from.
  google_mlkit_translation: ^0.15.1

  # On-device ML Kit Language Identification. Required because ML Kit's native
  # translator needs an explicit source language; this is how "Auto-detect"
  # resolves the source before translating.
  google_mlkit_language_id: ^0.15.1
  # --- PDF foundation ------------------------------------------------------
  # System document picker (Android's Storage Access Framework under the hood),
  # used to import a PDF. It hands back a real path, which is what the renderer
  # and the OCR engine both need.
  file_picker: ^13.1.0

  # Renders PDF pages to images for on-screen preview and for OCR. Native
  # (Pdfium/PDFKit) rather than a Dart parser, so a page can be rasterised at a
  # chosen resolution instead of being read as text.
  pdfx: ^2.11.0

  # Writes new PDFs (scan-to-PDF, image-to-PDF, page extraction). Pure Dart, so
  # documents are built from the page images already on disk and the app has no
  # dependency on a platform print/publish service.
  pdf: ^3.13.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  # On-device integration tests (`flutter test integration_test -d <device>`).
  # The only way to exercise the real ML Kit recognizer: the unit suite can
  # fake the engine but cannot prove that a picked image reaches native OCR.
  integration_test:
    sdk: flutter

  # Test-only JPEG encoder. Already in the dependency graph (transitively via
  # `pdf`), declared here because the device test uses it directly to turn a
  # rendered page into a camera-style JPEG.
  image: ^4.12.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Benchmark dataset. The synthetic tier is generated on the device at run time
  # and needs no files, so this directory only holds the *real-photograph* tier:
  # images you supply plus their transcriptions, described in manifest.json.
  # Both directories are bundled because Flutter requires an existing path; the
  # manifest ships empty and the harness reports that tier as unmeasured until
  # entries are added. See docs/OCR_BENCHMARK.md.
  assets:
    - assets/benchmark/
    - assets/benchmark/real/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
